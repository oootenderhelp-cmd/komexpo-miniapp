version: '3.8'

services:
  db:
    image: mariadb:11
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: komexpo_work
      MYSQL_USER: komexpo_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
      - ./drizzle/seed.sql:/docker-entrypoint-initdb.d/seed.sql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"

  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: mysql://komexpo_user:${MYSQL_PASSWORD}@db:3306/komexpo_work?charset=utf8mb4
      JWT_SECRET: ${JWT_SECRET}
      VITE_APP_ID: komexpo-work
      OWNER_OPEN_ID: owner-admin

volumes:
  db_data:
